name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Privacy & portability gate
        run: python3 SYSTEM/TOOLS/privacy_check.py
      - name: Schemas up to date
        run: python3 SYSTEM/TOOLS/build_schemas.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s SYSTEM/TESTS/unit -v
